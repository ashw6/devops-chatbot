apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-faq-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: college-faq-frontend }
  template:
    metadata:
      labels: { app: college-faq-frontend }
    spec:
      containers:
        - name: college-faq-frontend
          image: college-faq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: college-faq-frontend-svc
spec:
  type: NodePort
  selector: { app: college-faq-frontend }
  ports: [{ port: 80, targetPort: 80 }]
